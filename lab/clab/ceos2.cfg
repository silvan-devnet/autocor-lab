! ceos2 - full startup config for cEOS (containerlab uses it instead of its default config).
! Base = containerlab default (admin user, eAPI, gNMI, NETCONF) + RESTCONF on HTTPS 6020.
! admin/admin is the containerlab lab default - not a secret, never reuse it elsewhere.
! The RESTCONF certificate is created after boot by restconf-cert.sh.
no aaa root
username admin privilege 15 role network-admin secret admin
service routing protocols model multi-agent
hostname ceos2
spanning-tree mode mstp
!
! Ethernet1 = routed point-to-point link ceos1-ceos2 (OSPF in exercise 1.3)
interface Ethernet1
   no switchport
!
management api http-commands
   no shutdown
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
management api restconf
   transport https default
      ssl profile restconf
!
management security
   ssl profile restconf
      certificate restconf.crt key restconf.key
!
! The default control-plane ACL does not permit TCP 6020 (RESTCONF)
ip access-list CP-LAB
   10 permit icmp any any
   20 permit ip any any tracked
   30 permit ospf any any
   40 permit tcp any any eq ssh www https netconf-ssh gnmi bgp 6020
   50 permit tcp any eq bgp any
   60 permit udp any any eq bootps bootpc snmp ntp
!
system control-plane
   ip access-group CP-LAB in
!
end
